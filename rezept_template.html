<!DOCTYPE html>
<html lang="de" style="scroll-behavior: smooth;">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{RECIPE_TITLE}} | Anadoa Rezepte</title>
    <meta name="description" content="{{RECIPE_DESCRIPTION}}">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        earth: '#fbf5eb',
                        'earth-light': '#E8E2D8',
                        'earth-surface': '#FFFFFF',
                        gold: '#c19768',
                        sage: '#A3B19B',
                        mocha: '#5f3c17',
                        ash: '#2C2623',
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(193, 151, 104, 0.4);
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(193, 151, 104, 0.8);
        }
    </style>

    <!-- JSON-LD Recipe Schema -->
    {{SCHEMA_JSON}}


    <link rel="icon" href="assets/anadoa-favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/anadoa-favicon.png">
<link href="styles.css?v=1.0.3" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body class="bg-earth text-ash">
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K2P899XX"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

    <!-- Global Navigation Placeholder -->
    <div id="nav-placeholder"></div>
    <script src="components/nav.js"></script>

    <!-- Hero Header -->
    <header class="pt-32 pb-16 px-6 bg-earth text-center relative overflow-hidden">
        <div class="max-w-4xl mx-auto relative z-10">
            <p class="text-sm font-bold tracking-[0.2em] text-sage uppercase mb-4">{{CATEGORY}}</p>
            <h1 class="text-4xl md:text-6xl font-serif font-bold text-mocha mb-8">{{RECIPE_TITLE}}</h1>

            <div
                class="flex flex-wrap items-center justify-center gap-8 text-sm font-medium text-ash border-y border-earth-light py-5 mb-12">
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 text-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span>Vorbereitungszeit: {{PREP_TIME}}</span>
                </div>
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 text-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z">
                        </path>
                    </svg>
                    <span>Für {{YIELD}}</span>
                </div>
                {{IF_COOK_TIME}}
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 text-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 14v6m-3-3h6M6 10h2a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v2a2 2 0 002 2zm10 0h2a2 2 0 002-2V6a2 2 0 00-2-2h-2a2 2 0 00-2 2v2a2 2 0 002 2zM6 20h2a2 2 0 002-2v-2a2 2 0 00-2-2H6a2 2 0 00-2 2v2a2 2 0 002 2z">
                        </path>
                    </svg>
                    <span>Zubereitungszeit: {{COOK_TIME}}</span>
                </div>
                {{END_IF_COOK_TIME}}
            </div>

            <div
                class="relative w-full h-[350px] md:h-[500px] rounded-[3rem] overflow-hidden shadow-2xl bg-earth-light">
                <img src="{{RECIPE_IMAGE}}" alt="{{RECIPE_TITLE}}"
                    class="absolute inset-0 w-full h-full object-cover hover:scale-105 transition-transform duration-700">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main
        class="max-w-7xl mx-auto px-6 py-16 bg-white backdrop-blur-md rounded-3xl shadow-xl border border-white/60 mt-12 mb-24">
        <div class="flex flex-col lg:flex-row gap-16">

            <!-- Left Column: Zutaten -->
            <div class="w-full lg:w-1/3">
                <div class="bg-white rounded-[2rem] p-8 shadow-sm border border-earth-light sticky top-32 z-10">
                    <h2 class="text-2xl font-serif font-bold text-mocha mb-6 border-b border-earth-light pb-4">Zutaten
                    </h2>

                    <ul class="space-y-4 text-ash">
                        {{INGREDIENTS_LIST}}
                    </ul>
                </div>
            </div>

            <!-- Right Column: Zubereitung -->
            <div class="w-full lg:w-2/3">
                <h2 class="text-3xl font-serif font-bold text-mocha mb-8">Zubereitung</h2>

                <div class="space-y-8 text-lg leading-relaxed text-ash">
                    {{INSTRUCTIONS_HTML}}
                </div>

                <!-- Verwendete Produkte -->
                <div class="mt-16 pt-16 border-t border-earth-light">
                    <h3 class="text-sm font-bold tracking-[0.2em] text-sage uppercase mb-8">Verwendete Anadoa Produkte
                    </h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        {{USED_PRODUCTS_HTML}}
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Global Footer Placeholder -->
    <div id="footer-placeholder"></div>
    <script src="components/footer.js"></script>
</body>

</html>
